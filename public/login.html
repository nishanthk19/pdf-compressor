<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Access | Vibify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8 text-slate-900 font-sans antialiased">
  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
    <a href="/" class="inline-flex items-center gap-2 mb-6">
      <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-brand-500/20">
        V
      </div>
      <span class="text-xl font-bold tracking-tight text-slate-900">Vibify</span>
    </a>
    <h2 id="form-heading" class="text-2xl font-bold tracking-tight text-slate-900">Sign in to your account</h2>
    <p id="form-subheading" class="mt-2 text-sm text-slate-600">Access your document workspace and tools</p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md px-4 sm:px-0">
    <div class="bg-white py-8 px-6 shadow-xl shadow-slate-900/5 sm:rounded-2xl sm:px-10 border border-slate-100">
      
      <div id="error-message" class="hidden text-red-500 text-sm mb-4"></div>
      <div id="success-message" class="hidden text-emerald-600 bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-sm mb-4 font-medium"></div>

      <!-- Google Social Sign-In Button -->
      <div class="mb-5">
        <button type="button" id="google-signin-btn" class="w-full flex items-center justify-center gap-3 py-2.5 px-4 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-200 shadow-sm transition-all cursor-pointer">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
            <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.8s.2-2.1.4-2.8L1.9 6.3C.7 8.7 0 10.3 0 12s.7 3.3 1.9 5.7l3.7-2.9z"/>
            <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/>
          </svg>
          <span>Continue with Google</span>
        </button>

        <div class="relative my-5">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-slate-200"></div>
          </div>
          <div class="relative flex justify-center text-xs uppercase">
            <span class="bg-white px-3 text-slate-400 font-medium">Or continue with email</span>
          </div>
        </div>
      </div>

      <!-- Sign In Form -->
      <form id="signin-form" class="space-y-4">
        <div>
          <label for="signin-email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Email address</label>
          <div class="mt-1">
            <input id="signin-email" name="email" type="email" autocomplete="email" required class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition-all">
          </div>
        </div>

        <div>
          <label for="signin-password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Password</label>
          <div class="mt-1">
            <input id="signin-password" name="password" type="password" autocomplete="current-password" required class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition-all">
          </div>
        </div>

        <div class="pt-2">
          <button type="submit" class="flex w-full justify-center rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-brand-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600 transition-all cursor-pointer">
            Sign In
          </button>
        </div>
      </form>

      <!-- Sign Up Form -->
      <form id="signup-form" class="space-y-4 hidden">
        <div>
          <label for="signup-name" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Full Name</label>
          <div class="mt-1">
            <input id="signup-name" name="name" type="text" autocomplete="name" required class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition-all">
          </div>
        </div>

        <div>
          <label for="signup-email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Email address</label>
          <div class="mt-1">
            <input id="signup-email" name="email" type="email" autocomplete="email" required class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition-all">
          </div>
        </div>

        <div>
          <label for="signup-password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Password</label>
          <div class="mt-1">
            <input id="signup-password" name="password" type="password" autocomplete="new-password" required class="block w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition-all">
          </div>
        </div>

        <div class="pt-2">
          <button type="submit" class="flex w-full justify-center rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-brand-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600 transition-all cursor-pointer">
            Create Account
          </button>
        </div>
      </form>

      <div class="mt-6 text-center text-sm border-t border-slate-100 pt-5">
        <span id="toggle-prompt" class="text-slate-500">Don't have an account?</span>
        <button type="button" id="toggle-btn" class="font-semibold text-brand-600 hover:text-brand-500 ml-1 focus:outline-none cursor-pointer">
          Sign up
        </button>
      </div>

    </div>
  </div>

  <script src="/js/auth.js" defer></script>
</body>
</html>
