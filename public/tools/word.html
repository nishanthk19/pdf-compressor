  <link rel="stylesheet" href="/css/workspace.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(0.7rem, 1.1vw, 0.875rem);
      font-weight: 700;
      color: var(--text-muted);
      text-decoration: none;
      margin-bottom: 12px;
      transition: color 0.2s ease, font-size 0.2s ease;
    }
    .back-link span {
      font-size: clamp(0.7rem, 1.1vw, 0.875rem);
      transition: font-size 0.2s ease;
      white-space: nowrap;
    }
    .back-link:hover { color: var(--color-teal); }
    .btn-change-file {
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-dark);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: var(--radius-md);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="workspace-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/" class="back-link flex items-center gap-2">
          <img src="/vibify-logo.svg" alt="Vibify.tech" class="h-5 w-auto">
          <span>‹ Back to Vibify Suite</span>
        </a>
        <h2>PDF to Word</h2>
        <p>Convert PDF documents to editable Microsoft Word (.docx) files.</p>
      </div>

      <form id="wordForm" action="/word" method="POST" enctype="multipart/form-data" class="sidebar-body">
        <input type="file" id="fileInput" name="pdf" accept="application/pdf" style="display: none;" />

        <div class="form-group">
          <label class="form-label">Output Format</label>
          <div class="form-control" style="background: #f8fafc; font-size: 12px; color: var(--text-dark); font-weight: 700;">
            📄 Microsoft Word (.docx)
          </div>
        </div>
      </form>

      <div class="sidebar-footer">
        <button type="submit" form="wordForm" id="submitBtn" class="btn-primary-action" disabled>
          Convert to Word
        </button>
      </div>
    </aside>

    <main class="main-workspace">
      <div id="dropzone" class="dropzone-state">
        <div class="dropzone-icon">📝</div>
        <h3 class="dropzone-title">Convert PDF to Word</h3>
        <p class="dropzone-desc">Drag & drop your PDF document here to output a Word file.</p>
        <button type="button" class="btn-select-file">Select PDF File</button>
      </div>

      <div id="preview-area" class="preview-state">
        <div class="preview-bar">
          <div class="file-info">
            <span>📄</span>
            <span class="file-name">Document.pdf</span>
            <span class="page-count" style="color: var(--text-muted);">0 Pages</span>
          </div>
          <button type="button" class="btn-change-file" id="changeFileBtn">Change File</button>
        </div>
        <div class="preview-grid"></div>
      </div>
    </main>
  </div>

  <script src="/js/workspace.js"></script>
  <script src="/js/turbo-engine.js"></script>
  <script src="/js/futuristic-hud.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const submitBtn = document.getElementById('submitBtn');
      const fileInput = document.getElementById('fileInput');
      const changeFileBtn = document.getElementById('changeFileBtn');

      new PDFWorkspaceManager({
        dropzoneSelector: '#dropzone',
        previewStateSelector: '#preview-area',
        previewGridSelector: '.preview-grid',
        fileInputSelector: '#fileInput',
        fileSelectBtnSelector: '.btn-select-file',
        fileNameDisplaySelector: '.file-name',
        pageCountDisplaySelector: '.page-count',
        onFileLoaded: () => { submitBtn.disabled = false; }
      });

      if (changeFileBtn) changeFileBtn.addEventListener('click', () => fileInput.click());
    });
  </script>
</body>
</html>
