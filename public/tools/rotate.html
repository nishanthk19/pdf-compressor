  <style>
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(0.7rem, 1.1vw, 0.875rem);
      font-weight: 700;
      color: var(--text-muted);
      text-decoration: none;
      margin-bottom: 12px;
      transition: color 0.2s ease, font-size 0.2s ease;
    }
    .back-link span {
      font-size: clamp(0.7rem, 1.1vw, 0.875rem);
      transition: font-size 0.2s ease;
      white-space: nowrap;
    }
    .back-link:hover { color: var(--color-teal); }
    .btn-change-file {
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-dark);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-change-file:hover {
      background: #f0fdfd;
      border-color: var(--color-teal);
      color: var(--color-teal);
    }
  </style>
</head>
<body>
  <div class="workspace-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/" class="back-link flex items-center gap-2">
          <img src="/vibify-logo.svg" alt="Vibify.tech" class="h-5 w-auto">
          <span>‹ Back to Vibify Suite</span>
        </a>
        <h2>Rotate PDF</h2>
        <p>Rotate your PDF document pages by 90°, 180°, or 270°.</p>
      </div>

      <form id="rotateForm" action="/rotate" method="POST" enctype="multipart/form-data" class="sidebar-body">
        <input type="file" id="fileInput" name="pdf" accept="application/pdf" style="display: none;" />

        <div class="form-group">
          <label for="angle" class="form-label">Rotation Angle</label>
          <select id="angle" name="angle" class="form-control" required>
            <option value="90" selected>90° Clockwise</option>
            <option value="180">180° Upside Down</option>
            <option value="270">270° Counter-Clockwise</option>
          </select>
        </div>

        <div class="form-group">
          <label for="pages" class="form-label">Pages to Rotate</label>
          <select id="pages" name="pages" class="form-control">
            <option value="all" selected>All Pages</option>
            <option value="odd">Odd Pages Only</option>
            <option value="even">Even Pages Only</option>
          </select>
        </div>
      </form>

      <div class="sidebar-footer">
        <button type="submit" form="rotateForm" id="submitBtn" class="btn-primary-action" disabled>
          Rotate PDF File
        </button>
      </div>
    </aside>

    <main class="main-workspace">
      <div id="dropzone" class="dropzone-state">
        <div class="dropzone-icon">🔄</div>
        <h3 class="dropzone-title">Rotate PDF Document</h3>
        <p class="dropzone-desc">Drag & drop your PDF file here to rotate document orientation.</p>
        <button type="button" class="btn-select-file">Select PDF File</button>
      </div>

      <div id="preview-area" class="preview-state">
        <div class="preview-bar">
          <div class="file-info">
            <span>📄</span>
            <span class="file-name">Document.pdf</span>
            <span class="page-count" style="color: var(--text-muted);">0 Pages</span>
          </div>
          <button type="button" class="btn-change-file" id="changeFileBtn">Change File</button>
        </div>
        <div class="preview-grid"></div>
      </div>
    </main>
  </div>

  <script src="/js/workspace.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const submitBtn = document.getElementById('submitBtn');
      const fileInput = document.getElementById('fileInput');
      const changeFileBtn = document.getElementById('changeFileBtn');
      const rotateForm = document.getElementById('rotateForm');
      const angleSelect = document.getElementById('angle');
      const pagesSelect = document.getElementById('pages');

      const workspace = new PDFWorkspaceManager({
        dropzoneSelector: '#dropzone',
        previewStateSelector: '#preview-area',
        previewGridSelector: '.preview-grid',
        fileInputSelector: '#fileInput',
        fileSelectBtnSelector: '.btn-select-file',
        fileNameDisplaySelector: '.file-name',
        pageCountDisplaySelector: '.page-count',
        onFileLoaded: () => { submitBtn.disabled = false; }
      });

      if (changeFileBtn) changeFileBtn.addEventListener('click', () => fileInput.click());

      rotateForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const file = workspace.getSelectedFile();
        if (!file) {
          alert('Please select a PDF document first.');
          return;
        }

        const angle = parseInt(angleSelect.value, 10) || 90;
        const pageSelection = pagesSelect.value || 'all';

        if (window.VibifyProgressBar) {
          VibifyProgressBar.start({
            title: 'Rotating PDF Document',
            subtitle: 'Rotating document pages...',
            icon: '🔄'
          });
        }

        submitBtn.disabled = true;

        try {
          const { PDFDocument, degrees } = window.PDFLib;
          const bytes = await file.arrayBuffer();
          const pdfDoc = await PDFDocument.load(bytes, { ignoreEncryption: true });

          const pages = pdfDoc.getPages();
          pages.forEach((page, idx) => {
            const pageNum = idx + 1;
            let shouldRotate = true;
            if (pageSelection === 'odd') shouldRotate = pageNum % 2 !== 0;
            if (pageSelection === 'even') shouldRotate = pageNum % 2 === 0;

            if (shouldRotate) {
              const currentRot = page.getRotation().angle;
              page.setRotation(degrees((currentRot + angle) % 360));
            }
          });

          const pdfBytes = await pdfDoc.save();
          const blob = new Blob([pdfBytes], { type: 'application/pdf' });

          const downloadUrl = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = downloadUrl;
          a.download = `${file.name.replace(/\.pdf$/i, '')}_rotated.pdf`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(downloadUrl);

          if (window.VibifyProgressBar) {
            VibifyProgressBar.complete({
              title: 'PDF Rotated Successfully!',
              subtitle: 'Your rotated document downloaded automatically.'
            });
          }
        } catch (err) {
          console.warn('Rotation fallback to server:', err);
          const formData = new FormData(rotateForm);
          formData.set('pdf', file);
          const response = await fetch('/rotate', { method: 'POST', body: formData });
          if (!response.ok) throw new Error('Server rotation failed.');
          const blob = await response.blob();
          const downloadUrl = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = downloadUrl;
          a.download = `${file.name.replace(/\.pdf$/i, '')}_rotated.pdf`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          if (window.VibifyProgressBar) {
            VibifyProgressBar.complete({
              title: 'PDF Rotated Successfully!',
              subtitle: 'Your rotated document downloaded automatically.'
            });
          }
        } finally {
          submitBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
