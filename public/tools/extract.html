<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">

  <!-- Open Graph / Facebook -->

  <meta property="og:description" content="Extract and save specific pages from any PDF instantly on vibify.tech. Free &amp; private online tool.">
  <meta property="og:image" content="https://vibify.tech/vibify-og-image.png">
  <meta property="og:site_name" content="Vibify">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@vibifytech">
  <meta name="twitter:title" content="Extract PDF Pages Online | vibify.tech">
  <meta name="twitter:description" content="Extract specific pages or ranges from your PDF on vibify.tech.">
  <meta name="twitter:image" content="https://vibify.tech/vibify-og-image.png">
  <link rel="stylesheet" href="/css/workspace.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-decoration: none;
      margin-bottom: 12px;
      transition: color 0.2s ease;
    }
    .back-link:hover { color: var(--color-teal); }
    .btn-change-file {
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-dark);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: var(--radius-md);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="workspace-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/" class="back-link flex items-center gap-2">
          <img src="/vibify-logo.svg" alt="Vibify.tech" class="h-5 w-auto">
          <span>‹ Back to Vibify Suite</span>
        </a>
        <h2>Extract Pages</h2>
        <p>Extract specific page ranges into a new PDF document.</p>
      </div>

      <form id="extractForm" action="/extract" method="POST" enctype="multipart/form-data" class="sidebar-body">
        <input type="file" id="fileInput" name="pdf" accept="application/pdf" style="display: none;" />

        <div class="form-group">
          <label for="startPage" class="form-label">Start Page</label>
          <input type="number" id="startPage" name="startPage" min="1" value="1" class="form-control" required />
        </div>

        <div class="form-group">
          <label for="endPage" class="form-label">End Page</label>
          <input type="number" id="endPage" name="endPage" min="1" value="1" class="form-control" required />
        </div>
      </form>

      <div class="sidebar-footer">
        <button type="submit" form="extractForm" id="submitBtn" class="btn-primary-action" disabled>
          Extract Pages
        </button>
      </div>
    </aside>

    <main class="main-workspace">
      <div id="dropzone" class="dropzone-state">
        <div class="dropzone-icon">✂️</div>
        <h3 class="dropzone-title">Extract PDF Pages</h3>
        <p class="dropzone-desc">Drag & drop your PDF file here to extract a page range.</p>
        <button type="button" class="btn-select-file">Select PDF File</button>
      </div>

      <div id="preview-area" class="preview-state">
        <div class="preview-bar">
          <div class="file-info">
            <span>📄</span>
            <span class="file-name">Document.pdf</span>
            <span class="page-count" style="color: var(--text-muted);">0 Pages</span>
          </div>
          <button type="button" class="btn-change-file" id="changeFileBtn">Change File</button>
        </div>
        <div class="preview-grid"></div>
      </div>
    </main>
  </div>

  <script src="/js/workspace.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const submitBtn = document.getElementById('submitBtn');
      const fileInput = document.getElementById('fileInput');
      const changeFileBtn = document.getElementById('changeFileBtn');
      const startPageInput = document.getElementById('startPage');
      const endPageInput = document.getElementById('endPage');

      const workspace = new PDFWorkspaceManager({
        dropzoneSelector: '#dropzone',
        previewStateSelector: '#preview-area',
        previewGridSelector: '.preview-grid',
        fileInputSelector: '#fileInput',
        fileSelectBtnSelector: '.btn-select-file',
        fileNameDisplaySelector: '.file-name',
        pageCountDisplaySelector: '.page-count',
        onFileLoaded: (file, pdfDoc) => {
          submitBtn.disabled = false;
          if (pdfDoc) {
            endPageInput.value = pdfDoc.numPages;
            endPageInput.max = pdfDoc.numPages;
            startPageInput.max = pdfDoc.numPages;
          }
        }
      });

      if (changeFileBtn) changeFileBtn.addEventListener('click', () => fileInput.click());
    });
  </script>
</body>
</html>
