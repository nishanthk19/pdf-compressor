<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="/js/iframe-polyfill.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extract PDF Pages - Split PDF Online Free | vibify.tech</title>
  
  <meta name="title" content="Extract PDF Pages - Split PDF Online Free | vibify.tech">
  <meta name="description" content="Extract specific pages or page ranges from PDF documents online for free on vibify.tech. Fast, secure, and preserves original document formatting.">
  <meta name="keywords" content="extract pdf pages, split pdf, separate pdf pages, pdf page extractor, vibify.tech">
  <meta name="author" content="Vibify Tech">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://vibify.tech/tools/extract">
  <meta name="theme-color" content="#30525c">

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/css/workspace.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <!-- SEO & JSON-LD Structured Data Engine -->
  <script src="/js/seo-metadata.js"></script>

  <style>
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(0.7rem, 1.1vw, 0.875rem);
      font-weight: 700;
      color: var(--text-muted);
      text-decoration: none;
      margin-bottom: 12px;
      transition: color 0.2s ease, font-size 0.2s ease;
    }
    .back-link span {
      font-size: clamp(0.7rem, 1.1vw, 0.875rem);
      transition: font-size 0.2s ease;
      white-space: nowrap;
    }
    .back-link:hover { color: var(--color-teal); }
    .btn-change-file {
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-dark);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-change-file:hover {
      background: #f0fdfd;
      border-color: var(--color-teal);
      color: var(--color-teal);
    }
  </style>
</head>
<body>
  <div class="workspace-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/" class="back-link flex items-center gap-2">
          <img src="/vibify-logo.svg" alt="Vibify.tech" class="h-5 w-auto">
          <span>‹ Back to Vibify Suite</span>
        </a>
        <h2>Extract PDF Pages</h2>
        <p>Extract specific page ranges or individual pages into a separate document.</p>
      </div>

      <form id="extractForm" action="/extract" method="POST" enctype="multipart/form-data" class="sidebar-body">
        <input type="file" id="fileInput" name="pdf" accept="application/pdf" style="display: none;" />

        <div class="form-group">
          <label for="startPage" class="form-label">Start Page</label>
          <input type="number" id="startPage" name="startPage" min="1" value="1" class="form-control" required />
        </div>

        <div class="form-group">
          <label for="endPage" class="form-label">End Page</label>
          <input type="number" id="endPage" name="endPage" min="1" value="1" class="form-control" required />
        </div>
      </form>

      <div class="sidebar-footer">
        <button type="submit" form="extractForm" id="submitBtn" class="btn-primary-action" disabled>
          Extract Pages
        </button>
      </div>
    </aside>

    <main class="main-workspace">
      <div id="dropzone" class="dropzone-state">
        <div class="dropzone-icon">✂️</div>
        <h3 class="dropzone-title">Extract PDF Pages</h3>
        <p class="dropzone-desc">Drag & drop your PDF file here to extract selected pages into a new file.</p>
        <button type="button" class="btn-select-file">Select PDF File</button>
      </div>

      <div id="preview-area" class="preview-state">
        <div class="preview-bar">
          <div class="file-info">
            <span>📄</span>
            <span class="file-name">Document.pdf</span>
            <span class="page-count" style="color: var(--text-muted);">0 Pages</span>
          </div>
          <button type="button" class="btn-change-file" id="changeFileBtn">Change File</button>
        </div>
        <div class="preview-grid"></div>
      </div>
    </main>
  </div>

  <script src="/js/workspace.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const submitBtn = document.getElementById('submitBtn');
      const fileInput = document.getElementById('fileInput');
      const changeFileBtn = document.getElementById('changeFileBtn');
      const startPageInput = document.getElementById('startPage');
      const endPageInput = document.getElementById('endPage');
      const extractForm = document.getElementById('extractForm');

      let loadedNumPages = 1;

      const workspace = new PDFWorkspaceManager({
        dropzoneSelector: '#dropzone',
        previewStateSelector: '#preview-area',
        previewGridSelector: '.preview-grid',
        fileInputSelector: '#fileInput',
        fileSelectBtnSelector: '.btn-select-file',
        fileNameDisplaySelector: '.file-name',
        pageCountDisplaySelector: '.page-count',
        onFileLoaded: (file, pdfDoc) => {
          submitBtn.disabled = false;
          if (pdfDoc) {
            loadedNumPages = pdfDoc.numPages;
            endPageInput.value = pdfDoc.numPages;
            endPageInput.max = pdfDoc.numPages;
            startPageInput.max = pdfDoc.numPages;
          }
        }
      });

      if (changeFileBtn) changeFileBtn.addEventListener('click', () => fileInput.click());

      extractForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const file = workspace.getSelectedFile();
        if (!file) {
          alert('Please select a PDF document first.');
          return;
        }

        const start = parseInt(startPageInput.value, 10) || 1;
        const end = parseInt(endPageInput.value, 10) || loadedNumPages;

        if (start > end) {
          alert('Start page cannot be greater than End page.');
          return;
        }

        const pagesToExtract = [];
        for (let i = start; i <= end; i++) {
          pagesToExtract.push(i);
        }

        if (window.VibifyProgressBar) {
          VibifyProgressBar.start({
            title: 'Extracting Pages',
            subtitle: 'Isolating page range...',
            icon: '✂️'
          });
        }

        submitBtn.disabled = true;

        try {
          const { PDFDocument } = window.PDFLib;
          const bytes = await file.arrayBuffer();
          const srcDoc = await PDFDocument.load(bytes, { ignoreEncryption: true });
          const newDoc = await PDFDocument.create();

          const indicesToCopy = pagesToExtract
            .map((p) => p - 1)
            .filter((idx) => idx >= 0 && idx < srcDoc.getPageCount());

          if (indicesToCopy.length === 0) {
            throw new Error('No valid pages in range to extract.');
          }

          const copiedPages = await newDoc.copyPages(srcDoc, indicesToCopy);
          copiedPages.forEach((page) => newDoc.addPage(page));

          const pdfBytes = await newDoc.save();
          const blob = new Blob([pdfBytes], { type: 'application/pdf' });

          const downloadUrl = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = downloadUrl;
          a.download = `${file.name.replace(/\.pdf$/i, '')}_extracted_${start}-${end}.pdf`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(downloadUrl);

          if (window.VibifyProgressBar) {
            VibifyProgressBar.complete({
              title: 'Pages Extracted Successfully!',
              subtitle: `Extracted ${pagesToExtract.length} pages.`
            });
          }
        } catch (err) {
          console.warn('Extract fallback to server:', err);
          const formData = new FormData(extractForm);
          formData.set('pdf', file);
          const response = await fetch('/extract', { method: 'POST', body: formData });
          if (!response.ok) throw new Error('Server extraction failed.');
          const blob = await response.blob();
          const downloadUrl = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = downloadUrl;
          a.download = `${file.name.replace(/\.pdf$/i, '')}_extracted.pdf`;
          document.body.appendChild(a);
          a.click();
          a.remove();

          if (window.VibifyProgressBar) {
            VibifyProgressBar.complete({
              title: 'Pages Extracted Successfully!',
              subtitle: 'Your extracted document downloaded automatically.'
            });
          }
        } finally {
          submitBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
