<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Favicons and App Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://vibify.tech/tools/delete.html">
  <meta property="og:title" content="Delete PDF Pages Online | vibify.tech">
  <meta property="og:description" content="Remove unwanted pages from any PDF document instantly on vibify.tech. Free &amp; secure.">
  <meta property="og:image" content="https://vibify.tech/vibify-og-image.png">
  <meta property="og:site_name" content="Vibify">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@vibifytech">
  <meta name="twitter:title" content="Delete PDF Pages Online | vibify.tech">
  <meta name="twitter:description" content="Remove specific pages or page ranges from your PDF file on vibify.tech.">
  <meta name="twitter:image" content="https://vibify.tech/vibify-og-image.png">
  <link rel="stylesheet" href="/css/workspace.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-decoration: none;
      margin-bottom: 12px;
      transition: color 0.2s ease;
    }
    .back-link:hover { color: var(--color-teal); }
    .btn-change-file {
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-dark);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: var(--radius-md);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="workspace-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/" class="back-link flex items-center gap-2">
          <img src="/vibify-logo.svg" alt="Vibify.tech" class="h-5 w-auto">
          <span>‹ Back to Vibify Suite</span>
        </a>
        <h2>Delete Pages</h2>
        <p>Remove specific pages from your PDF file.</p>
      </div>

      <form id="deleteForm" action="/delete-pages" method="POST" enctype="multipart/form-data" class="sidebar-body">
        <input type="file" id="fileInput" name="pdf" accept="application/pdf" style="display: none;" />

        <div class="form-group">
          <label for="pages" class="form-label">Page Numbers to Delete</label>
          <input type="text" id="pages" name="pages" placeholder="e.g. 1, 3, 5-7" class="form-control" required />
          <p style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">
            Specify comma-separated page numbers or ranges to remove.
          </p>
        </div>
      </form>

      <div class="sidebar-footer">
        <button type="submit" form="deleteForm" id="submitBtn" class="btn-primary-action" disabled>
          Delete Specified Pages
        </button>
      </div>
    </aside>

    <main class="main-workspace">
      <div id="dropzone" class="dropzone-state">
        <div class="dropzone-icon">🗑️</div>
        <h3 class="dropzone-title">Delete PDF Pages</h3>
        <p class="dropzone-desc">Drag & drop your PDF file here to select pages for deletion.</p>
        <button type="button" class="btn-select-file">Select PDF File</button>
      </div>

      <div id="preview-area" class="preview-state">
        <div class="preview-bar">
          <div class="file-info">
            <span>📄</span>
            <span class="file-name">Document.pdf</span>
            <span class="page-count" style="color: var(--text-muted);">0 Pages</span>
          </div>
          <button type="button" class="btn-change-file" id="changeFileBtn">Change File</button>
        </div>
        <div class="preview-grid"></div>
      </div>
    </main>
  </div>

  <script src="/js/workspace.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const submitBtn = document.getElementById('submitBtn');
      const fileInput = document.getElementById('fileInput');
      const changeFileBtn = document.getElementById('changeFileBtn');

      new PDFWorkspaceManager({
        dropzoneSelector: '#dropzone',
        previewStateSelector: '#preview-area',
        previewGridSelector: '.preview-grid',
        fileInputSelector: '#fileInput',
        fileSelectBtnSelector: '.btn-select-file',
        fileNameDisplaySelector: '.file-name',
        pageCountDisplaySelector: '.page-count',
        onFileLoaded: () => { submitBtn.disabled = false; }
      });

      if (changeFileBtn) changeFileBtn.addEventListener('click', () => fileInput.click());
    });
  </script>
</body>
</html>
