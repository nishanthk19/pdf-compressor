  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Toast notification system
      function showToast(message, type = 'success') {
        const container = document.getElementById('toastContainer');
        if (!container) return;

        const toast = document.createElement('div');
        toast.className = `pointer-events-auto px-4 py-2.5 rounded-xl shadow-xl text-xs font-bold text-white flex items-center gap-2 transition-all transform translate-y-2 opacity-0 ${
          type === 'error' ? 'bg-rose-600 border border-rose-500' : 'bg-slate-900/90 backdrop-blur border border-slate-700 text-teal-300'
        }`;
        
        toast.innerHTML = `
          <span>${type === 'error' ? '❌' : '✨'}</span>
          <span>${message}</span>
        `;

        container.appendChild(toast);

        // Animate in
        requestAnimationFrame(() => {
          toast.classList.remove('translate-y-2', 'opacity-0');
        });

        // Remove after 3 seconds
        setTimeout(() => {
          toast.classList.add('opacity-0', 'translate-y-2');
          setTimeout(() => {
            if (toast.parentNode) toast.parentNode.removeChild(toast);
          }, 300);
        }, 3000);
      }

          class: ChecklistTool,

          blocks: [
            { type: 'header', data: { text: 'Project Proposal: Next-Gen PDF Suite', level: 1 } },
            { type: 'paragraph', data: { text: 'This proposal outlines the deployment of an end-to-end client document creation & PDF conversion tool built on modern Editor.js and browser-native rendering engines.' } },
            { type: 'delimiter', data: {} },
            { type: 'header', data: { text: '1. Executive Summary', level: 2 } },
            { type: 'quote', data: { text: 'Precision document creation requires clean block-structured data that translates seamlessly into print-ready PDF layouts.', caption: 'Technical Architecture Brief' } },

        },

          header: { title: 'ENGINEERING TEAM SYNC MINUTES', subtitle: 'Date: August 12, 2026' },
          footer: { left: 'Internal Engineering Brief', right: 'Page 1 of 1' },
          blocks: [
            { type: 'header', data: { text: 'Weekly Engineering Sync Minutes', level: 1 } },
            { type: 'paragraph', data: { text: '<strong>Date:</strong> August 12, 2026 | <strong>Attendees:</strong> Core Engineering Team' } },
            { type: 'delimiter', data: {} },
            { type: 'header', data: { text: 'Agenda Topics', level: 2 } },
            {
              type: 'list',
              data: {
                style: 'ordered',
                items: [
                  'Review of recent PDF processing speed benchmarks',

            {
              type: 'checklist',

                items: [
                  { text: 'Audit Editor.js CDN tool loading fallback strategies', checked: true },
                  { text: 'Verify cross-browser iframe keyboard event safety', checked: true },
                  { text: 'Finalize document template selection panel', checked: true }
                ]
              }
            }
          ]
        },
        invoice: {
          name: 'Invoice / Report',
          header: { title: 'INVOICE STATEMENT #PDF-2026-089', subtitle: 'Acme Corp Inc. • Due Aug 26, 2026' },
          footer: { left: 'Thank you for your business! Payment terms: Net 14', right: 'Page 1 of 1' },
          blocks: [
            { type: 'header', data: { text: 'INVOICE #PDF-2026-089', level: 1 } },
            { type: 'paragraph', data: { text: '<strong>Billed To:</strong> Acme Corporation Inc.<br><strong>Date:</strong> August 12, 2026 | <strong>Due Date:</strong> August 26, 2026' } },
            { type: 'delimiter', data: {} },
            { type: 'header', data: { text: 'Services Rendered', level: 2 } },
            {
              type: 'table',
              data: {
                content: [
                  ['Description', 'Hours', 'Rate', 'Total'],
                  ['PDF Engine Architecture Optimization', '10 hrs', '$120.00', '$1,200.00'],
                  ['Editor.js Block Parser Implementation', '8 hrs', '$120.00', '$960.00'],
                  ['Custom Theme Styling & Export Suite', '6 hrs', '$120.00', '$720.00']
                ]
              }
            },
            { type: 'quote', data: { text: 'Total Due: $2,880.00 USD', caption: 'Payment terms: Net 14 days' } },
            { type: 'warning', data: { title: 'Payment Details', message: 'Please send wire transfers to Account #9982-1102-331.' } }
          ]
        }
      };

      // SECTION VISIBILITY STATE AND TOGGLE HANDLERS
      let isHeaderEnabled = true;
      let isFooterEnabled = true;

      function syncSectionVisibility() {
        const hSec = document.getElementById('headerSection');
        const fSec = document.getElementById('footerSection');
        const hToggle = document.getElementById('toggleHeaderSectionToggle');
        const fToggle = document.getElementById('toggleFooterSectionToggle');

        if (hSec) {
          if (isHeaderEnabled) {
            hSec.classList.remove('hidden');
            if (hToggle) { hToggle.className = "px-2 py-0.5 rounded text-[11px] font-bold bg-teal-500 text-white transition-all cursor-pointer"; }
          } else {
            hSec.classList.add('hidden');
            if (hToggle) { hToggle.className = "px-2 py-0.5 rounded text-[11px] font-bold bg-slate-700 text-slate-400 transition-all cursor-pointer"; }
          }
        }

        if (fSec) {
          if (isFooterEnabled) {
            fSec.classList.remove('hidden');
            if (fToggle) { fToggle.className = "px-2 py-0.5 rounded text-[11px] font-bold bg-teal-500 text-white transition-all cursor-pointer"; }
          } else {
            fSec.classList.add('hidden');
            if (fToggle) { fToggle.className = "px-2 py-0.5 rounded text-[11px] font-bold bg-slate-700 text-slate-400 transition-all cursor-pointer"; }
          }
        }
      }

      // Attach Toggle Buttons Event Listeners
      const hToggleBtn = document.getElementById('toggleHeaderSectionToggle');
      if (hToggleBtn) {
        hToggleBtn.addEventListener('click', () => {
          isHeaderEnabled = !isHeaderEnabled;
          syncSectionVisibility();
          showToast(isHeaderEnabled ? 'Header Section Enabled' : 'Header Section Hidden');
        });
      }

      const fToggleBtn = document.getElementById('toggleFooterSectionToggle');
      if (fToggleBtn) {
        fToggleBtn.addEventListener('click', () => {
          isFooterEnabled = !isFooterEnabled;
          syncSectionVisibility();
          showToast(isFooterEnabled ? 'Footer Section Enabled' : 'Footer Section Hidden');
        });
      }

      const hideHBtn = document.getElementById('hideHeaderBtn');
      if (hideHBtn) {
        hideHBtn.addEventListener('click', () => {
          isHeaderEnabled = false;
          syncSectionVisibility();
          showToast('Header Section Hidden');
        });
      }

      const hideFBtn = document.getElementById('hideFooterBtn');
      if (hideFBtn) {
        hideFBtn.addEventListener('click', () => {
          isFooterEnabled = false;
          syncSectionVisibility();
          showToast('Footer Section Hidden');
        });
      }

      // 2. INITIALIZE EDITOR.JS
      let editor = new EditorJS({
        holder: 'editorjs',
        placeholder: 'Click here or press "/" to start creating blocks...',
        tools: toolsConfig,
        data: TEMPLATES.proposal,
        onChange: () => {
          updateMetrics();
        }
      });

      // 3. METRICS UPDATE COUNTER
      async function updateMetrics() {
        try {
          const data = await editor.save();
          const blocks = data.blocks || [];
          document.getElementById('blockCount').textContent = blocks.length;

          let textContent = '';
          blocks.forEach(b => {
            if (b.data && b.data.text) textContent += ' ' + b.data.text;
            if (b.data && b.data.items) {
              b.data.items.forEach(it => {
                const itemTxt = typeof it === 'string' ? it : (it.text || '');
                textContent += ' ' + itemTxt;
              });
            }
          });

          const cleanText = textContent.replace(/<[^>]*>/g, '').trim();
          const words = cleanText ? cleanText.split(/\s+/).length : 0;
          document.getElementById('wordCount').textContent = words;
          document.getElementById('readTime').textContent = Math.ceil(words / 200) + ' min';
        } catch (e) {
          // ignore
        }
      }

      setTimeout(updateMetrics, 1000);

      // 4. LIVE CANVAS STYLING UPDATER
      function updateCanvasStyles() {
        const paperSheet = document.getElementById('paperSheet');
        const metricsBar = document.getElementById('paperMetricsBar');
        const size = document.getElementById('paperSizeSelect').value;
        const orientation = document.getElementById('orientationSelect').value;
        const font = document.getElementById('fontSelect').value;
        const accent = document.getElementById('accentColorSelect').value;

        // Watermark text updates
        document.getElementById('canvasOrientationText').textContent = orientation.charAt(0).toUpperCase() + orientation.slice(1);
        document.getElementById('canvasSizeText').textContent = size.toUpperCase();

        // 1. Width & Aspect ratio
        if (orientation === 'landscape') {
          paperSheet.className = "w-full max-w-5xl bg-white rounded-md shadow-2xl border border-slate-300 p-8 sm:p-12 min-h-[600px] transition-all duration-300 relative flex flex-col justify-between mx-auto";
          metricsBar.className = "w-full max-w-5xl mt-4 flex items-center justify-between text-xs text-slate-500 font-semibold px-2";
        } else {
          paperSheet.className = "w-full max-w-4xl bg-white rounded-md shadow-2xl border border-slate-300 p-8 sm:p-12 min-h-[900px] transition-all duration-300 relative flex flex-col justify-between mx-auto";
          metricsBar.className = "w-full max-w-4xl mt-4 flex items-center justify-between text-xs text-slate-500 font-semibold px-2";
        }

        // Min height based on size
        if (size === 'legal') {
          paperSheet.style.minHeight = orientation === 'landscape' ? '680px' : '1050px';
        } else if (size === 'a4') {
          paperSheet.style.minHeight = orientation === 'landscape' ? '600px' : '920px';
        } else {
          paperSheet.style.minHeight = orientation === 'landscape' ? '580px' : '880px';
        }

        // 2. Font Family
        if (font === 'serif') {
          paperSheet.style.fontFamily = 'Georgia, Cambria, "Times New Roman", Times, serif';
        } else if (font === 'mono') {
          paperSheet.style.fontFamily = 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace';
        } else {
          paperSheet.style.fontFamily = 'ui-sans-serif, system-ui, -apple-system, sans-serif';
        }

        // 3. Dynamic Accent Theme Styles
        let styleTag = document.getElementById('dynamicAccentStyles');
        if (!styleTag) {
          styleTag = document.createElement('style');
          styleTag.id = 'dynamicAccentStyles';
          document.head.appendChild(styleTag);
        }

        styleTag.innerHTML = `
          #paperSheet .ce-header {
            color: ${accent} !important;
            border-bottom: 2px solid ${accent}25;
            padding-bottom: 4px;
          }
          #paperSheet blockquote {
            border-left: 4px solid ${accent} !important;
            background-color: ${accent}08 !important;
          }
          #paperSheet .cdx-checklist__item--checked .cdx-checklist__item-checkbox {
            background-color: ${accent} !important;
            border-color: ${accent} !important;
          }
          #paperSheet .tc-table__header {
            background-color: ${accent}15 !important;
            color: ${accent} !important;
            font-weight: bold;
          }
          #headerAccentBorder {
            border-bottom-color: ${accent} !important;
          }
          #headerTitleInput {
            color: ${accent} !important;
          }
          #footerAccentBorder {
            border-top-color: ${accent} !important;
          }
        `;
      }

      // Attach Live Change Listeners to Top Menu Formatting Dropdowns
      ['paperSizeSelect', 'orientationSelect', 'fontSelect', 'accentColorSelect'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener('change', () => {
            updateCanvasStyles();
            
            let label = 'Setting updated';
            if (id === 'paperSizeSelect') label = `Paper size set to ${el.value.toUpperCase()}`;
            if (id === 'orientationSelect') label = `Orientation changed to ${el.value}`;
            if (id === 'fontSelect') label = `Font set to ${el.options[el.selectedIndex].text}`;
            if (id === 'accentColorSelect') label = `Theme changed to ${el.options[el.selectedIndex].text}`;
            
            showToast(label);
          });
        }
      });

      // Initial Canvas Style Apply
      updateCanvasStyles();

      // 5. TEMPLATE SWITCHING HANDLER
      document.querySelectorAll('.template-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const tKey = btn.getAttribute('data-template');
          const templateObj = TEMPLATES[tKey];
          if (!templateObj) return;

          // Update active button UI highlight
          document.querySelectorAll('.template-btn').forEach(b => {
            b.className = "template-btn bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg transition-all font-semibold flex items-center gap-1.5 cursor-pointer";

          btn.className = "template-btn bg-teal-600 text-white shadow-md ring-2 ring-teal-400/50 px-3 py-1.5 rounded-lg transition-all font-bold flex items-center gap-1.5 cursor-pointer";

          // Populate Header and Footer fields
          if (templateObj.header) {
            document.getElementById('headerTitleInput').value = templateObj.header.title || '';
            document.getElementById('headerSubtitleInput').value = templateObj.header.subtitle || '';
          }
          if (templateObj.footer) {
            document.getElementById('footerLeftInput').value = templateObj.footer.left || '';
            document.getElementById('footerRightInput').value = templateObj.footer.right || '';

          try {
            await editor.isReady;
            await editor.render(templateObj);
            updateMetrics();
            showToast(`Applied ${templateObj.name} Template`);
          } catch (err) {
            console.error('Failed to load template:', err);
            showToast('Failed to apply template', 'error');
          }

      });

      // 6. QUICK INSERTION BUTTONS
      document.querySelectorAll('.quick-insert-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const blockType = btn.getAttribute('data-block');
          try {
            await editor.isReady;
            let initialData = {};
            if (blockType === 'header') initialData = { text: 'New Heading', level: 2 };
            else if (blockType === 'paragraph') initialData = { text: 'New paragraph text...' };
            else if (blockType === 'list') initialData = { style: 'unordered', items: ['List item 1', 'List item 2'] };
            else if (blockType === 'checklist') initialData = { items: [{ text: 'Task 1', checked: false }] };
            else if (blockType === 'table') initialData = { content: [['Header 1', 'Header 2'], ['Cell 1', 'Cell 2']] };
            else if (blockType === 'quote') initialData = { text: 'Quote text here...', caption: 'Author' };
            else if (blockType === 'warning') initialData = { title: 'Attention', message: 'Warning callout message...' };
            else if (blockType === 'code') initialData = { code: '// Your code here\nconsole.log("Hello PDF");' };

            await editor.blocks.insert(blockType, initialData);

      // 8. COMPREHENSIVE BLOCK-TO-HTML PARSER WITH HEADER AND FOOTER SUPPORT
      function parseBlocksToHTML(blocks, accentColor, fontFamily, headerData, footerData) {
        let fontCss = "font-family: system-ui, -apple-system, sans-serif;";
        if (fontFamily === 'serif') fontCss = "font-family: Georgia, 'Times New Roman', serif;";
        if (fontFamily === 'mono') fontCss = "font-family: 'Courier New', Courier, monospace;";

        let html = `<div style="${fontCss} color: #1e293b; line-height: 1.6; display: flex; flex-direction: column; justify-content: space-between; min-height: 100%;">`;

        // 1. RENDER HEADER SECTION
        if (headerData && headerData.enabled) {
          html += `
            <div style="border-bottom: 2.5px solid ${accentColor}; padding-bottom: 10px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-end; ${fontCss}">
              <div style="font-size: 14px; font-weight: 800; color: ${accentColor}; text-transform: uppercase; letter-spacing: 0.05em;">${headerData.title || ''}</div>
              <div style="font-size: 11px; color: #64748b; font-weight: 600; text-align: right;">${headerData.subtitle || ''}</div>
            </div>
          `;
        }

        // 2. RENDER BODY CONTENT SECTION
        html += `<div style="flex-grow: 1;">`;

        if (!blocks || !Array.isArray(blocks) || blocks.length === 0) {
          html += '<p style="color: #94a3b8; font-style: italic;">Empty Document</p>';
        } else {

          blocks.forEach(block => {
            switch (block.type) {
              case 'header': {
                const level = block.data.level || 2;
                const text = block.data.text || '';
                const fontSizeMap = { 1: '28px', 2: '22px', 3: '18px', 4: '16px', 5: '14px', 6: '13px' };
                const fSize = fontSizeMap[level] || '20px';
                html += `<h${level} style="${fontCss} font-size: ${fSize}; font-weight: bold; margin-top: 1.4em; margin-bottom: 0.5em; color: ${accentColor}; border-bottom: ${level <= 2 ? '2px solid ' + accentColor + '20' : 'none'}; padding-bottom: ${level <= 2 ? '4px' : '0'};">${text}</h${level}>`;
                break;
              }

              case 'paragraph': {
                const text = block.data.text || '';
                html += `<p style="${fontCss} font-size: 14px; margin-bottom: 1em; color: #334155;">${text}</p>`;
                break;
              }

              case 'list': {
                const tag = block.data.style === 'ordered' ? 'ol' : 'ul';
                const items = block.data.items || [];
                const itemsHtml = items.map(item => {
                  const itemTxt = typeof item === 'string' ? item : (item.content || '');
                  return `<li style="margin-bottom: 0.4em;">${itemTxt}</li>`;
                }).join('');
                html += `<${tag} style="${fontCss} font-size: 14px; margin-bottom: 1em; padding-left: 1.6em; color: #334155;">${itemsHtml}</${tag}>`;
                break;
              }

              case 'checklist': {
                const items = block.data.items || [];
                const listHtml = items.map(item => {
                  const isChecked = item.checked;
                  const checkSymbol = isChecked ? '☑' : '☐';
                  const strikeStyle = isChecked ? 'text-decoration: line-through; opacity: 0.7;' : '';
                  return `<div style="display: flex; align-items: center; gap: 8px; margin-bottom: 0.5em; font-size: 14px; color: #334155; ${strikeStyle}">
                    <span style="font-size: 16px; color: ${isChecked ? accentColor : '#94a3b8'};">${checkSymbol}</span>
                    <span>${item.text || ''}</span>
                  </div>`;
                }).join('');
                html += `<div style="margin-bottom: 1em; padding: 4px 0;">${listHtml}</div>`;
                break;
              }

              case 'table': {
                const content = block.data.content || [];
                let rowsHtml = '';
                content.forEach((row, rIdx) => {
                  let cellsHtml = '';
                  row.forEach(cell => {
                    const isHeader = rIdx === 0 && block.data.withHeadings;
                    const tag = isHeader ? 'th' : 'td';
                    const bg = isHeader ? `background-color: ${accentColor}10; font-weight: bold; color: ${accentColor};` : 'background-color: #ffffff;';
                    cellsHtml += `<${tag} style="border: 1px solid #cbd5e1; padding: 8px 12px; font-size: 13px; text-align: left; ${bg}">${cell}</${tag}>`;
                  });
                  rowsHtml += `<tr>${cellsHtml}</tr>`;
                });
                html += `<table style="width: 100%; border-collapse: collapse; margin-bottom: 1.2em; ${fontCss}">${rowsHtml}</table>`;
                break;
              }

              case 'quote': {
                const text = block.data.text || '';
                const caption = block.data.caption || '';
                html += `<blockquote style="border-left: 4px solid ${accentColor}; background-color: #f8fafc; padding: 12px 16px; margin: 1.2em 0; border-radius: 0 8px 8px 0; ${fontCss}">
                  <p style="font-style: italic; font-size: 14px; margin: 0; color: #334155;">"${text}"</p>
                  ${caption ? `<cite style="display: block; margin-top: 6px; font-size: 12px; font-weight: bold; color: #64748b;">— ${caption}</cite>` : ''}
                </blockquote>`;
                break;
              }

              case 'warning': {
                const title = block.data.title || 'Note';
                const message = block.data.message || '';
                html += `<div style="background-color: #fffbeb; border: 1px solid #fcd34d; border-left: 5px solid #f59e0b; padding: 12px 16px; border-radius: 6px; margin-bottom: 1.2em; ${fontCss}">
                  <div style="font-weight: bold; font-size: 14px; color: #b45309; margin-bottom: 4px;">⚠️ ${title}</div>
                  <div style="font-size: 13px; color: #78350f;">${message}</div>
                </div>`;
                break;
              }

              case 'code': {
                const codeTxt = block.data.code || '';
                html += `<pre style="background-color: #0f172a; color: #f8fafc; padding: 14px 18px; border-radius: 8px; font-family: 'Courier New', Courier, monospace; font-size: 12px; overflow-x: auto; margin-bottom: 1.2em; white-space: pre-wrap;"><code>${codeTxt.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>`;
                break;
              }

              case 'delimiter': {
                html += `<hr style="border: none; border-top: 2px dashed #cbd5e1; margin: 2em 0;" />`;
                break;
              }

              case 'image': {
                const url = block.data.url || '';
                const caption = block.data.caption || '';
                if (url) {
                  html += `<figure style="margin: 1.5em 0; text-align: center;">
                    <img src="${url}" alt="${caption}" style="max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);" />
                    ${caption ? `<figcaption style="font-size: 12px; color: #64748b; margin-top: 6px;">${caption}</figcaption>` : ''}
                  </figure>`;
                }
                break;
              }

              case 'raw': {
                html += `<div style="margin-bottom: 1em;">${block.data.html || ''}</div>`;
                break;
              }

              default: {
                if (block.data && block.data.text) {
                  html += `<p style="${fontCss} font-size: 14px; margin-bottom: 1em; color: #334155;">${block.data.text}</p>`;
                }
              }
            }
          });

        }

        html += `</div>`;

        // 3. RENDER FOOTER SECTION
        if (footerData && footerData.enabled) {
          html += `
            <div style="border-top: 1.5px solid ${accentColor}40; padding-top: 10px; margin-top: 32px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #64748b; ${fontCss}">
              <div>${footerData.left || ''}</div>
              <div style="font-weight: 600;">${footerData.right || ''}</div>
            </div>
          `;
        }

        html += '</div>';
        return html;
      }

      // 9. EXPORT TO PDF HANDLER
      const exportBtn = document.getElementById('exportPdfBtn');
      exportBtn.addEventListener('click', async () => {
        try {
          exportBtn.disabled = true;
          exportBtn.innerHTML = `
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Building PDF...
          `;

          const outputData = await editor.save();
          const pSize = document.getElementById('paperSizeSelect').value || 'letter';
          const pOrient = document.getElementById('orientationSelect').value || 'portrait';
          const pFont = document.getElementById('fontSelect').value || 'sans';
          const pAccent = document.getElementById('accentColorSelect').value || '#1e293b';

          const headerData = {
            enabled: isHeaderEnabled,
            title: document.getElementById('headerTitleInput')?.value || '',
            subtitle: document.getElementById('headerSubtitleInput')?.value || ''
          };

          const footerData = {
            enabled: isFooterEnabled,
            left: document.getElementById('footerLeftInput')?.value || '',
            right: document.getElementById('footerRightInput')?.value || ''
          };

          const parsedHTML = parseBlocksToHTML(outputData.blocks || [], pAccent, pFont, headerData, footerData);

          // Create temporary off-screen container for rendering
          const wrapper = document.createElement('div');
          wrapper.style.position = 'absolute';
          wrapper.style.left = '-9999px';
          wrapper.style.top = '-9999px';
          wrapper.style.width = pOrient === 'landscape' ? '950px' : '750px';
          wrapper.style.padding = '40px';
          wrapper.style.backgroundColor = '#ffffff';
          wrapper.innerHTML = parsedHTML;

          document.body.appendChild(wrapper);

          // Configure html2pdf options
          const opt = {
            margin: 0.5,
            filename: 'created_document.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, logging: false },
            jsPDF: { unit: 'in', format: pSize, orientation: pOrient }
          };

          await html2pdf().from(wrapper).set(opt).save();

          document.body.removeChild(wrapper);
          showToast('PDF Exported Successfully!');
        } catch (err) {
          console.error('PDF generation error:', err);
          showToast('Failed to generate PDF: ' + err.message, 'error');
        } finally {
          exportBtn.disabled = false;
          exportBtn.innerHTML = `
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Export to PDF
          `;
        }
      });
    });
  </script>
</body>
</html>
