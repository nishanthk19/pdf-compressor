<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="/js/iframe-polyfill.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merge PDFs Online - Combine Multiple PDF Files | vibify.tech</title>
  
  <!-- Primary SEO Meta Tags -->
  <meta name="title" content="Merge PDFs Online - Combine Multiple PDF Files | vibify.tech">
  <meta name="description" content="Combine multiple PDF files into one organized document online for free on vibify.tech. Reorder pages, drag &amp; drop files, fast &amp; secure with zero registration.">
  <meta name="keywords" content="merge pdf, combine pdfs, join pdf files, pdf merger online, vibify.tech">
  <meta name="author" content="Vibify Tech">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://vibify.tech/tools/merge.html">
  <meta name="theme-color" content="#8b5cf6">

  <!-- Favicons and App Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://vibify.tech/tools/merge.html">
  <meta property="og:title" content="Merge PDFs Online - Combine PDF Files | vibify.tech">
  <meta property="og:description" content="Combine multiple PDF documents effortlessly into a single organized file on vibify.tech. Free &amp; private.">
  <meta property="og:image" content="https://vibify.tech/vibify-og-image.png">
  <meta property="og:site_name" content="Vibify">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@vibifytech">
  <meta name="twitter:title" content="Merge PDFs Online | vibify.tech">
  <meta name="twitter:description" content="Fast, free online PDF merger on vibify.tech. Combine files with drag &amp; drop page reordering.">
  <meta name="twitter:image" content="https://vibify.tech/vibify-og-image.png">
  <link rel="stylesheet" href="/css/workspace.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-decoration: none;
      margin-bottom: 12px;
      transition: color 0.2s ease;
    }
    .back-link:hover { color: var(--color-teal); }
    .btn-change-file {
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--text-dark);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: var(--radius-md);
      cursor: pointer;
    }
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .file-item {
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 10px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="workspace-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/" class="back-link flex items-center gap-2">
          <img src="/vibify-logo.svg" alt="Vibify.tech" class="h-5 w-auto">
          <span>‹ Back to Vibify Suite</span>
        </a>
        <h2>Merge PDFs</h2>
        <p>Combine 2 or more PDF documents into a single document.</p>
      </div>

      <form id="mergeForm" action="/merge" method="POST" enctype="multipart/form-data" class="sidebar-body">
        <input type="file" id="fileInput" name="pdfs" accept="application/pdf" multiple style="display: none;" />
        
        <div class="form-group">
          <label class="form-label">Selected Files to Combine</label>
          <div id="fileListContainer" class="file-list">
            <div style="font-size: 12px; color: var(--text-muted); font-style: italic;">No files selected yet.</div>
          </div>
        </div>
      </form>

      <div class="sidebar-footer">
        <button type="submit" form="mergeForm" id="submitBtn" class="btn-primary-action" disabled>
          Merge PDFs Now
        </button>
      </div>
    </aside>

    <main class="main-workspace">
      <div id="dropzone" class="dropzone-state">
        <div class="dropzone-icon">🧩</div>
        <h3 class="dropzone-title">Merge PDF Documents</h3>
        <p class="dropzone-desc">Drag & drop two or more PDF files to combine them in sequence.</p>
        <button type="button" class="btn-select-file">Select PDF Files</button>
      </div>

      <div id="preview-area" class="preview-state">
        <div class="preview-bar">
          <div class="file-info">
            <span>📄</span>
            <span class="file-name">Multiple Files Selected</span>
          </div>
          <button type="button" class="btn-change-file" id="changeFileBtn">Add / Change Files</button>
        </div>
        <div class="preview-grid"></div>
      </div>
    </main>
  </div>

  <script src="/js/workspace.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const submitBtn = document.getElementById('submitBtn');
      const fileInput = document.getElementById('fileInput');
      const changeFileBtn = document.getElementById('changeFileBtn');
      const fileListContainer = document.getElementById('fileListContainer');

      const workspace = new PDFWorkspaceManager({
        dropzoneSelector: '#dropzone',
        previewStateSelector: '#preview-area',
        previewGridSelector: '.preview-grid',
        fileInputSelector: '#fileInput',
        fileSelectBtnSelector: '.btn-select-file',
        fileNameDisplaySelector: '.file-name',
        pageCountDisplaySelector: '.page-count',
        onFileLoaded: (file, pdfDoc) => {
          if (fileInput.files && fileInput.files.length >= 2) {
            submitBtn.disabled = false;
            fileListContainer.innerHTML = '';
            Array.from(fileInput.files).forEach((f, idx) => {
              const div = document.createElement('div');
              div.className = 'file-item';
              div.innerHTML = `<span>${idx + 1}. ${f.name}</span> <span style="color: var(--color-teal);">${(f.size/(1024*1024)).toFixed(2)} MB</span>`;
              fileListContainer.appendChild(div);
            });
          } else if (fileInput.files && fileInput.files.length === 1) {
            fileListContainer.innerHTML = `<div class="file-item"><span>1. ${fileInput.files[0].name}</span></div><div style="font-size: 11px; color: var(--accent-rose); margin-top: 4px;">Select at least 1 more file to merge.</div>`;
            submitBtn.disabled = true;
          }
        }
      });

      if (changeFileBtn) changeFileBtn.addEventListener('click', () => fileInput.click());
    });
  </script>
</body>
</html>
