<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile & History | Vibify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full flex flex-col font-sans text-slate-900 antialiased">
  
  <!-- Navigation Header -->
  <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200/80 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold text-lg shadow-md shadow-brand-500/20">
          V
        </div>
        <span class="text-lg font-bold tracking-tight text-slate-900">Vibify</span>
      </a>

      <div id="auth-nav-links" class="flex items-center gap-3">
        <!-- Injected via nav.js -->
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12 space-y-8">
    
    <!-- User Profile Header Card -->
    <div class="bg-white rounded-2xl p-6 sm:p-8 border border-slate-200/80 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6">
      <div class="flex items-center gap-4">
        <div id="user-avatar" class="w-16 h-16 rounded-2xl bg-brand-100 text-brand-700 flex items-center justify-center text-2xl font-black">
          U
        </div>
        <div>
          <h1 id="user-name" class="text-xl sm:text-2xl font-bold text-slate-900">Loading Profile...</h1>
          <p id="user-email" class="text-sm text-slate-500">Retrieving account details</p>
          <div id="user-verified-badge" class="mt-2 inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600">
            Checking status
          </div>
        </div>
      </div>

      <div class="flex items-center gap-3 w-full sm:w-auto">
        <a href="/" class="flex-1 sm:flex-none text-center px-4 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-xs font-bold transition-all shadow-sm">
          Use PDF Tools
        </a>
      </div>
    </div>

    <!-- Processing History Section -->
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
      <div class="p-6 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <div>
          <h2 class="text-lg font-bold text-slate-900">Processing History</h2>
          <p class="text-xs text-slate-500 mt-0.5">Audit log of your processed documents</p>
        </div>
        <div class="inline-flex items-center gap-1.5 text-xs text-amber-700 bg-amber-50 border border-amber-200/80 px-3 py-1.5 rounded-xl font-medium">
          <svg class="w-4 h-4 text-amber-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span>No files are stored, only log history.</span>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50/80 text-xs font-semibold text-slate-500 uppercase border-b border-slate-100">
            <tr>
              <th scope="col" class="px-6 py-3.5">Date & Time</th>
              <th scope="col" class="px-6 py-3.5">Tool Used</th>
              <th scope="col" class="px-6 py-3.5">File Name</th>
              <th scope="col" class="px-6 py-3.5 text-right">Status</th>
            </tr>
          </thead>
          <tbody id="logs-table-body" class="divide-y divide-slate-100">
            <tr>
              <td colspan="4" class="px-6 py-8 text-center text-slate-400 text-sm">
                Loading history...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="/js/nav.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
