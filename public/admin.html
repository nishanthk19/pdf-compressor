<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibify Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    
    <!-- Navigation -->
    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center shadow-lg">
        <h1 class="text-xl font-bold text-indigo-400">Vibify // Database Admin</h1>
        <div class="flex items-center gap-4">
            <a href="/" class="text-sm text-gray-400 hover:text-white transition">Home</a>
            <button onclick="wipeDatabase()" class="bg-red-600 hover:bg-red-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition shadow">
                Wipe All Data
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-6 py-8">
        
        <!-- Stats Bar -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-gray-800 border border-gray-700 p-6 rounded-xl shadow">
                <p class="text-sm text-gray-400">Total Users</p>
                <p id="stat-users" class="text-3xl font-bold text-indigo-400 mt-1">0</p>
            </div>
            <div class="bg-gray-800 border border-gray-700 p-6 rounded-xl shadow">
                <p class="text-sm text-gray-400">Active Sessions</p>
                <p id="stat-sessions" class="text-3xl font-bold text-green-400 mt-1">0</p>
            </div>
            <div class="bg-gray-800 border border-gray-700 p-6 rounded-xl shadow">
                <p class="text-sm text-gray-400">Processing Logs</p>
                <p id="stat-logs" class="text-3xl font-bold text-yellow-400 mt-1">0</p>
            </div>
        </div>

        <!-- Users Table Section -->
        <section class="bg-gray-800 border border-gray-700 rounded-xl overflow-hidden shadow-lg mb-8">
            <div class="px-6 py-4 border-b border-gray-700 flex justify-between items-center bg-gray-800/50">
                <h2 class="font-semibold text-lg text-gray-200">Registered Users</h2>
                <button onclick="loadAdminData()" class="text-xs bg-gray-700 hover:bg-gray-600 text-gray-200 px-3 py-1.5 rounded-lg transition">Refresh</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-900/60 text-gray-400 text-xs uppercase tracking-wider border-b border-gray-700">
                            <th class="px-6 py-3">User</th>
                            <th class="px-6 py-3">Email Verified</th>
                            <th class="px-6 py-3">Providers</th>
                            <th class="px-6 py-3">Created At</th>
                            <th class="px-6 py-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body" class="divide-y divide-gray-700 text-sm">
                        <tr><td colspan="5" class="px-6 py-6 text-center text-gray-500">Loading records...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        async function loadAdminData() {
            try {
                const res = await fetch('/api/admin/data', { credentials: 'include' });
                if (!res.ok) {
                    if (res.status === 401 || res.status === 403) {
                        alert("Unauthorized. Please log in to your account first.");
                        window.location.href = '/login.html';
                        return;
                    }
                    throw new Error("Failed to fetch data");
                }
                
                const data = await res.json();
                
                // Update stats
                let totalSessions = data.users.reduce((acc, u) => acc + (u.sessions ? u.sessions.length : 0), 0);
                document.getElementById('stat-users').textContent = data.users.length;
                document.getElementById('stat-sessions').textContent = totalSessions;
                document.getElementById('stat-logs').textContent = data.processingLogs.length;

                // Render Users Table
                const tbody = document.getElementById('users-table-body');
                if (data.users.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-gray-500">No users found in database.</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.users.map(user => `
                    <tr class="hover:bg-gray-750/50 transition">
                        <td class="px-6 py-4">
                            <div class="font-medium text-white">${user.name || 'No Name'}</div>
                            <div class="text-xs text-gray-400">${user.email}</div>
                        </td>
                        <td class="px-6 py-4">
                            <span class="px-2.5 py-1 text-xs rounded-full font-medium ${user.emailVerified ? 'bg-green-950 text-green-400 border border-green-800' : 'bg-yellow-950 text-yellow-400 border border-yellow-800'}">
                                ${user.emailVerified ? 'Verified' : 'Pending'}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-xs text-gray-400">
                            ${user.accounts.map(a => a.providerId).join(', ') || 'credentials'}
                        </td>
                        <td class="px-6 py-4 text-xs text-gray-400">${new Date(user.createdAt).toLocaleDateString()}</td>
                        <td class="px-6 py-4 text-right">
                            <button onclick="deleteUser('${user.id}')" class="text-red-400 hover:text-red-300 text-xs font-semibold px-3 py-1 bg-red-950/60 border border-red-900 rounded-lg transition">Delete</button>
                        </td>
                    </tr>
                `).join('');

            } catch (err) {
                console.error(err);
                alert("Error loading admin dashboard data.");
            }
        }

        async function deleteUser(userId) {
            if (!confirm("Are you sure you want to delete this user?")) return;
            try {
                const res = await fetch(`/api/admin/users/${userId}`, { method: 'DELETE', credentials: 'include' });
                if (res.ok) {
                    loadAdminData();
                } else {
                    alert("Failed to delete user.");
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function wipeDatabase() {
            if (!confirm("⚠️ WARNING: This will permanently wipe all users, sessions, and logs! Are you sure?")) return;
            try {
                const res = await fetch('/api/admin/wipe', { method: 'POST', credentials: 'include' });
                if (res.ok) {
                    alert("Database wiped successfully.");
                    loadAdminData();
                } else {
                    alert("Failed to wipe database.");
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Initialize on load
        loadAdminData();
    </script>
</body>
</html>
