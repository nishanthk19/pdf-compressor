name: Letter Studio acceptance
on:
  pull_request:
  push:
    branches: [main]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://fixture:fixture@localhost:5432/fixture
      LETTER_CHROMIUM_NO_SANDBOX: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/letter-browser.test.mjs
        env:
          LETTER_BROWSER_TEST: "1"
