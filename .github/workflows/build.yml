name: Build Desktop Signer (Windows)

on:
  workflow_dispatch: 
  push:
    paths:
      - 'desktop_signer.py' 

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # FIX 1: Drop down to Python 3.10 for better cryptography wheel support
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
           architecture: 'x86'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyhanko python-pkcs11

    # FIX 2: Force PyInstaller to collect ALL hidden crypto data and modules
    - name: Build EXE with PyInstaller
      run: >
        pyinstaller --onefile --windowed 
        --collect-all pyhanko 
        --collect-all pkcs11 
        --collect-all pyhanko_certvalidator
        desktop_signer.py

    - name: Upload EXE as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DSC_Signer_Windows
        path: dist/desktop_signer.exe
