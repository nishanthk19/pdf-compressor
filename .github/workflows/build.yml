name: Build Desktop Signer (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop_signer.py'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        architecture: 'x86'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # FIX: Pin to stable versions that have pre-compiled 32-bit Windows wheels
        pip install pyinstaller cryptography==41.0.7 pyhanko==0.20.1 python-pkcs11

    - name: Build EXE with PyInstaller
      run: >
        pyinstaller --onefile --windowed 
        --collect-all pyhanko 
        --collect-all pkcs11 
        --collect-all pyhanko_certvalidator
        --collect-all cryptography
        --collect-all cffi
        desktop_signer.py

    - name: Upload EXE as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DSC_Signer_Windows
        path: dist/desktop_signer.exe
